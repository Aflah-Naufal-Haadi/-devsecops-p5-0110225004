
name: Pemeriksaan Aplikasi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build dan Pengujian
    runs-on: ubuntu-latest
    steps:
      - name: Mengambil kode proyek
        uses: actions/checkout@v4

      - name: Menyiapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Memeriksa sintaks Python
        run: python -m compileall -q main.py tasks.py data.py validation.py summary.py

      - name: Menjalankan pengujian otomatis
        run: python -m unittest test_tasks -v

  sast-scan:
    name: Pemindaian Keamanan Kode
    runs-on: ubuntu-latest
    steps:
      - name: Mengambil kode proyek
        uses: actions/checkout@v4

      - name: Menyiapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Memasang Bandit
        run: pip install bandit

      - name: Memindai keamanan kode
        run: bandit -r main.py tasks.py data.py validation.py summary.py --severity-level medium --confidence-level medium

  quality-gate:
    name: Pemeriksaan Quality Gate
    needs: [build, sast-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Memastikan semua pemeriksaan lulus
        run: echo "Quality Gate lulus: build, pengujian, dan SAST berhasil."
